<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#080c16">
<meta name="description" content="香港即時天氣 3D 地圖：18 區溫度、體感、雨量、閃電，附 7 日歷史時間軸回放。資料來源：香港天文台。">
<title>香港天氣 3D · 即時雷暴雨量地圖</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Widgets/widgets.css">
<link rel="stylesheet" href="/styles.css?v=2.0.1">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.119/Build/Cesium/Cesium.js"></script>
</head>
<body>

<div id="cesium"></div>

<!-- ============ loading (§19) ============ -->
<div class="load" id="loading" role="status" aria-live="polite">
  <div class="ring" aria-hidden="true"></div>
  <h1>載入香港天氣</h1>
  <div class="track"><i id="ldBar"></i></div>
  <div class="states">
    <div><span>3D 地圖</span><span id="ldMap">⟳ 載入中</span></div>
    <div><span>天氣資料</span><span id="ldWx">⟳ 載入中</span></div>
    <div><span>閃電資料</span><span id="ldLtn">⟳ 載入中</span></div>
  </div>
  <p id="ldSub" style="font-size:11px;color:var(--ink-4)">連接天文台…</p>
</div>

<!-- ============ header ============ -->
<header class="hdr">
  <div class="brand">🌤️ 香港天氣 3D<small>HONG KONG WEATHER 3D</small></div>
  <div class="spacer"></div>
  <button class="chip" id="alertChip" aria-label="天氣警告">🌤 無警告</button>
  <span class="tick" id="hdrClock">--:--</span>
</header>
<div class="warnbar" id="warnBar" role="alert"></div>

<!-- ============ HUD (§5) ============ -->
<section class="hud" id="hud" aria-label="即時天氣">
  <div class="hud-top"><span class="hud-now">NOW</span><span class="hud-area" id="hudArea">全港</span></div>
  <div class="hcol">
    <div class="big" id="hudTemp">--<span>°C</span></div>
    <div class="feels" id="hudFeels">體感 --°C</div>
  </div>
  <div class="mini">
    <div>💧 濕度<b id="hudHum">--%</b></div>
    <div>🌧 雨量<b id="hudRain">--</b></div>
    <div>⚡ 閃電<b id="hudLtn">--</b></div>
  </div>
  <span class="nl-m" id="hudNLM"></span>
  <div class="nl" id="hudNL" aria-live="polite">載入天氣狀況…</div>
  <div class="times" id="hudTime">--</div>
  <button class="retry" id="hudRetry" hidden>重試</button>
</section>

<!-- ============ layer switcher (§8) ============ -->
<nav class="layers" id="layerMenu" aria-label="天氣圖層">
  <span class="lt">圖層</span>
  <button class="seg" data-mode="rain" aria-pressed="false"><span class="ic">🌧</span><span class="lb">雨量</span><span class="unit">mm</span></button>
  <button class="seg" data-mode="temp" aria-pressed="false"><span class="ic">🌡</span><span class="lb">溫度</span><span class="unit">°C</span></button>
  <button class="seg" data-mode="feels" aria-pressed="false"><span class="ic">🥵</span><span class="lb">體感</span><span class="unit">°C</span></button>
  <button class="seg" data-mode="lightning" aria-pressed="false"><span class="ic">⚡</span><span class="lb">閃電</span><span class="unit">次</span></button>
  <button class="seg" data-mode="storm" aria-pressed="false"><span class="ic">⛈</span><span class="lb">雷暴</span><span class="unit">綜合</span></button>
  <div class="divider"></div>
  <button class="seg" id="tgLabels" aria-pressed="true" title="顯示區名"><span class="ic">🏷</span><span class="lb">區名</span></button>
  <button class="seg" id="tgSun" aria-pressed="false" title="日夜日照"><span class="ic">🌗</span><span class="lb">日夜</span></button>
  <button class="seg" id="tgLegend" aria-pressed="false" title="圖例"><span class="ic">📖</span><span class="lb">圖例</span></button>
</nav>

<!-- ============ legend (§22) ============ -->
<aside class="legend" id="legendBox" aria-label="圖例">
  <h3 id="legTitle">圖例</h3>
  <div id="legBody"></div>
  <div class="leg-note" id="legScaleNote"></div>
</aside>

<!-- ============ timeline (§10) ============ -->
<div class="tl" id="tlBar">
  <div class="tl-row">
    <button class="play" id="tlPlay" aria-pressed="false" aria-label="播放歷史回放">▶</button>
    <input type="range" id="tlSlider" min="0" max="0" value="0" aria-label="歷史時間軸">
    <span class="stamp" id="tlTime">即時</span>
    <button class="live" id="tlLive" aria-pressed="true">即時</button>
    <button class="replay" id="tlReplay">回放 60 分</button>
  </div>
  <div class="tl-row2">
    <div class="axis" id="tlAxis"><i>--</i><i>--</i><i>--</i><i>現在</i></div>
    <span id="tlCount">--</span>
  </div>
</div>

<!-- ============ primary stats (§16) ============ -->
<div class="stats" id="statBar">
  <span class="stat"><span>🌡 最高</span><b id="stMax">--</b></span>
  <span class="stat"><span>🌡 最低</span><b id="stMin">--</b></span>
  <span class="stat"><span>💧 濕度</span><b id="stHum">--</b></span>
  <span class="stat"><span>🌧 最高雨量</span><b id="stRain">--</b></span>
  <span class="stat"><span>⚡ 閃電</span><b id="stLtn">--</b></span>
  <button class="more" id="btnMore">更多天氣資料</button>
</div>

<div class="credit">天氣資料：香港天文台 HKO · 3D 建築：CSDI · 地圖：Esri</div>

<!-- ============ bottom nav (§17) ============ -->
<nav class="nav" id="nav" role="tablist" aria-label="主導覽">
  <button role="tab" data-tab="map" aria-selected="true"><span class="ic">🗺</span>地圖</button>
  <button role="tab" data-tab="now" aria-selected="false"><span class="ic">📊</span>即時</button>
  <button role="tab" data-tab="timeline" aria-selected="false"><span class="ic">⏱</span>時間軸</button>
  <button role="tab" data-tab="alerts" aria-selected="false"><span class="ic">⚠️</span>警告<span class="nd" id="tgForecastBadge"></span></button>
  <button role="tab" data-tab="more" aria-selected="false"><span class="ic">⋯</span>更多</button>
</nav>

<div class="backdrop" id="backdrop"></div>

<!-- ============ sheets ============ -->
<section class="sheet" id="nowPanel" role="dialog" aria-label="即時天氣">
  <div class="grab" data-grab><i></i></div>
  <div class="sh-hd"><h2>📊 即時天氣</h2><button class="x" data-close aria-label="關閉">✕</button></div>
  <div class="sh-bd" id="nowBody"></div>
</section>

<section class="sheet" id="tlPanel" role="dialog" aria-label="時間軸回放">
  <div class="grab" data-grab><i></i></div>
  <div class="sh-hd"><h2>⏱ 歷史時間軸</h2><button class="x" data-close aria-label="關閉">✕</button></div>
  <div class="sh-bd" id="tlBody"></div>
</section>

<section class="sheet" id="alertPanel" role="dialog" aria-label="天氣警告">
  <div class="grab" data-grab><i></i></div>
  <div class="sh-hd"><h2>⚠️ 警告與資料狀態</h2><button class="x" data-close aria-label="關閉">✕</button></div>
  <div class="sh-bd" id="alertBody"></div>
</section>

<section class="sheet" id="morePanel" role="dialog" aria-label="更多天氣資料">
  <div class="grab" data-grab><i></i></div>
  <div class="sh-hd"><h2>更多天氣資料</h2><button class="x" data-close aria-label="關閉">✕</button></div>
  <div class="sh-bd" id="moreBody"></div>
</section>

<section class="sheet" id="detailPanel" role="dialog" aria-label="區域詳情">
  <div class="grab" data-grab><i></i></div>
  <div class="sh-hd"><h2 class="dp-name" id="dpName">區域</h2><button class="x" data-close aria-label="關閉">✕</button></div>
  <div class="sh-bd" id="dpBody"></div>
</section>

<!-- hidden hosts for core.js' HKO forecast / tips renderers -->
<div style="display:none" aria-hidden="true">
  <div id="forecastBar"><span id="fbPeriod"></span><span id="fbDesc"></span><span id="fbOutlook"></span></div>
  <div id="swtBar"></div>
</div>

<div class="tip" id="tooltip3d" role="tooltip"></div>
<div class="toast" id="toast" role="status"></div>

<script src="/core.js?v=2.0.1"></script>
<script src="/v2.js?v=2.0.1"></script>
</body>
</html>
